<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Series y Boletos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --accent-triple: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px 16px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      touch-action: manipulation;
    }

    .card:hover, .card:active {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.25);
    }

    .card .icon {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .card .number {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .card .label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Tarjeta especial para Triple */
    .card.special {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.2) 0%, rgba(30, 41, 59, 0.8) 100%);
      border-color: rgba(244, 63, 94, 0.3);
      padding: 24px;
    }

    .card.special:hover, .card.special:active {
      border-color: var(--accent-triple);
      box-shadow: 0 8px 25px rgba(244, 63, 94, 0.3);
    }

    .card.special .number {
      color: #fda4af;
      font-size: 1.4rem;
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
      
      .card.special {
        grid-column: span 4;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>CSI GIJÓN</h1>
    <p>Selecciona una opción para acceder</p>
  </header>

  <main class="grid">
    <a href="serie1.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 1</div>
    </a>

    <a href="serie2.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 2</div>
    </a>

    <a href="serie3.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 3</div>
    </a>

    <a href="serie4.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 4</div>
    </a>

    <a href="serie5.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 5</div>
    </a>

    <a href="serie6.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 6</div>
    </a>

    <a href="serie7.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 7</div>
    </a>

    <a href="serie8.html" class="card">
      <div class="icon">📁</div>
      <div class="number">Serie 8</div>
    </a>

    <a href="triple.html" class="card special">
      <div class="icon">🎟️</div>
      <div class="number">Boleto Triple</div>
    </a>
  </main>

</body>
</html>
