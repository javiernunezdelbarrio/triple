<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boleto - Triple</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
  }
  .ticket {
    max-width: 980px;
    margin: auto;
    background: white;
    border: 1px solid #bbb;
    box-shadow: 0 4px 18px rgba(0,0,0,.12);
    padding: 28px;
  }
  h1 {
    text-align: center;
    margin: 0 0 6px;
    font-size: 26px;
  }
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 22px;
  }
  .section {
    border-top: 3px solid #111;
    margin-top: 28px;
    padding-top: 16px;
  }
  .section h2 {
    text-align: center;
    margin: 0 0 14px;
    font-size: 21px;
  }
  .instruction {
    text-align: center;
    font-size: 13px;
    color: #555;
    margin-bottom: 14px;
  }

  /* Triángulo de parejas */
  .triangle {
    width: min(100%, 760px);
    margin: 0 auto 20px;
  }
  .pair-row {
    display: flex;
    height: 46px;
    margin-bottom: 2px;
  }
  .pair-row .indent {
    flex: 0 0 calc(var(--indent) * 1px);
  }
  .pair {
    flex: 0 0 78px;
    height: 44px;
    border: 1px solid #c66;
    background: #fff;
    color: #222;
    cursor: pointer;
    font-size: 14px;
    position: relative;
    transition: background .12s, color .12s;
  }
  .pair:hover { background: #fff0f0; }
  .pair.selected {
    background: #ffe7e7;
    color: transparent;
  }
  .pair.selected::after {
    content: "✕";
    color: #111;
    font-size: 31px;
    font-weight: bold;
    line-height: 40px;
    position: absolute;
    inset: 0;
    text-align: center;
  }

  .order-title {
    text-align: center;
    font-size: 14px;
    margin: 8px 0 7px;
    font-weight: bold;
  }
  .orders {
    width: min(100%, 780px);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    border-left: 1px solid #c66;
    border-top: 1px solid #c66;
  }
  .order {
    border-right: 1px solid #c66;
    border-bottom: 1px solid #c66;
    min-width: 0;
  }
  .order-label {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    background: #fafafa;
  }
  .order input {
    width: 100%;
    height: 44px;
    border: 0;
    outline: none;
    text-align: center;
    font-size: 20px;
    background: white;
  }
  .order input:focus { background: #fff7f7; }

  .summary {
    margin: 34px auto 0;
    max-width: 780px;
    border: 2px solid #222;
    padding: 18px;
    background: #fafafa;
  }
  .summary h2 {
    margin: 0 0 14px;
    text-align: center;
  }
  .results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .result {
    background: white;
    border: 1px solid #ccc;
    padding: 12px;
    text-align: center;
  }
  .result .count {
    font-size: 25px;
    font-weight: bold;
  }
  .result .value {
    margin-top: 4px;
    font-size: 15px;
  }
  .total {
    margin-top: 14px;
    padding: 14px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-top: 2px solid #222;
  }
  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .actions button {
    border: 1px solid #333;
    background: #fff;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }
  .actions button:hover { background: #eee; }

  .status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin: 12px 0 4px;
  }
  .status button {
    border: 1px solid #aaa;
    background: white;
    padding: 7px 15px;
    cursor: pointer;
  }
  .status button.active {
    border-color: #222;
    background: #eee;
    font-weight: bold;
  }

  @media (max-width: 700px) {
    body { padding: 8px; }
    .ticket { padding: 12px; }
    .pair { flex-basis: 58px; font-size: 11px; }
    .pair-row .indent { flex-basis: calc(var(--indent) * .74px); }
    .orders { font-size: 11px; }
    .results { grid-template-columns: 1fr; }
    .order input { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="ticket">
  <h1>BOLETO DE LA TRIPLE</h1>
  <div class="subtitle">Marca las casillas haciendo clic sobre ellas</div>

  <div class="status">
    <span><b>Resultado:</b></span>
    <button id="bienBtn" onclick="setStatus('BIEN')">BIEN</button>
    <button id="malBtn" onclick="setStatus('MAL')">MAL</button>
  </div>

  <div id="sections"></div>

  <div class="summary">
    <h2>Cálculo</h2>
    <div class="results">
      <div class="result">
        <div>Sección 1</div>
        <div class="count" id="count1">0</div>
      </div>
      <div class="result">
        <div>Sección 2</div>
        <div class="count" id="count2">0</div>
      </div>
      <div class="result">
        <div>Sección 3</div>
        <div class="count" id="count3">0</div>
      </div>
    </div>
    <div class="total">
      TOTAL: (<span id="count1total">0</span> ×
      <span id="count2total">0</span> ×
      <span id="count3total">0</span>) × 0,3 =
      <span id="total">0.00</span>
    </div>
    <div class="actions">
      <button onclick="clearAll()">Borrar todas las cruces</button>
    </div>
  </div>
</div>

<script>
const sectionsContainer = document.getElementById('sections');
const sectionData = [
  { title: 'Primera de la Triple' },
  { title: 'Segunda de la Triple' },
  { title: 'Tercera de la Triple' }
];

function createSection(sectionIndex, title) {
  const section = document.createElement('div');
  section.className = 'section';
  section.dataset.section = sectionIndex;

  const h2 = document.createElement('h2');
  h2.textContent = title;
  section.appendChild(h2);

  const instruction = document.createElement('div');
  instruction.className = 'instruction';
  instruction.textContent = 'Primera de la Triple · Haz clic en una pareja para colocar o quitar la X';
  section.appendChild(instruction);

  const triangle = document.createElement('div');
  triangle.className = 'triangle';

  // Parejas: 1-2 ... 1-10, 2-3 ... 2-10, etc.
  for (let first = 1; first <= 9; first++) {
    const row = document.createElement('div');
    row.className = 'pair-row';

    const indent = document.createElement('div');
    indent.className = 'indent';
    indent.style.setProperty('--indent', (first - 1) * 78);
    row.appendChild(indent);

    for (let second = first + 1; second <= 10; second++) {
      const button = document.createElement('button');
      button.className = 'pair';
      button.type = 'button';
      button.textContent = `${first}-${second}`;
      button.dataset.section = sectionIndex;
      button.dataset.pair = `${first}-${second}`;

      button.addEventListener('click', () => {
        button.classList.toggle('selected');
        updateTotals();
      });

      row.appendChild(button);
    }
    triangle.appendChild(row);
  }

  section.appendChild(triangle);

  const orderTitle = document.createElement('div');
  orderTitle.className = 'order-title';
  orderTitle.textContent = 'Orden sustituciones';
  section.appendChild(orderTitle);

  const orders = document.createElement('div');
  orders.className = 'orders';

  for (let i = 1; i <= 10; i++) {
    const order = document.createElement('div');
    order.className = 'order';

    const label = document.createElement('div');
    label.className = 'order-label';
    label.textContent = `${i}°`;

    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 3;
    input.setAttribute('aria-label', `Orden ${i}`);

    order.appendChild(label);
    order.appendChild(input);
    orders.appendChild(order);
  }

  section.appendChild(orders);
  sectionsContainer.appendChild(section);
}

sectionData.forEach((s, i) => createSection(i + 1, s.title));

function updateTotals() {
  const counts = [];

  for (let i = 1; i <= 3; i++) {
    const count = document.querySelectorAll(
      `.pair[data-section="${i}"].selected`
    ).length;

    counts.push(count);
    document.getElementById(`count${i}`).textContent = count;
    document.getElementById(`count${i}total`).textContent = count;
  }

  // Producto de las tres secciones × 0,3
  const total = counts[0] * counts[1] * counts[2] * 0.3;
  document.getElementById('total').textContent = total.toFixed(2);
}

function clearAll() {
  document.querySelectorAll('.pair.selected').forEach(el => {
    el.classList.remove('selected');
  });
  document.querySelectorAll('.order input').forEach(input => {
    input.value = '';
  });
  updateTotals();
}

function setStatus(status) {
  document.getElementById('bienBtn').classList.toggle('active', status === 'BIEN');
  document.getElementById('malBtn').classList.toggle('active', status === 'MAL');
}
</script>
</body>
</html>
